server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  tracing:
    sampling:
      probability: 1.0

spring:
  cloud:
    gateway:
      routes:
        - id: userservice
          uri: lb://FeignUserService
          predicates:
            - Path=/api/users/**

        - id: orderservice
          uri: lb://FeignOrderService
          predicates:
            - Path=/api/orders/**